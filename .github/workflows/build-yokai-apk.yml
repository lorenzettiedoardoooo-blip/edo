name: Build YOKAI APK

on:
  workflow_dispatch:
  push:
    branches: ["yokai-workout-creator"]
    paths:
      - "lib/**"
      - "pubspec.yaml"
      - ".github/workflows/build-yokai-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          mkdir -p /tmp/yokai_source
          cp -R lib /tmp/yokai_source/lib
          cp pubspec.yaml /tmp/yokai_source/pubspec.yaml
          rm -rf android lib pubspec.yaml test
          flutter create --platforms=android --org com.yokai --project-name yokai_workout_creator .
          rm -rf lib
          cp -R /tmp/yokai_source/lib ./lib
          cp /tmp/yokai_source/pubspec.yaml ./pubspec.yaml
          sed -i 's/android:label="yokai_workout_creator"/android:label="YOKAI WORKOUT CREATOR"/g' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YOKAI-WORKOUT-CREATOR-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
